<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Student Portal — School ERP Ecosystem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <header class="border-b border-slate-800 bg-slate-900/80 p-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="p-2 bg-indigo-600 rounded-lg"><i data-lucide="graduation-cap"></i></div>
      <span class="font-bold text-lg">Student ERP Portal</span>
    </div>
    <div class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-3 py-1 rounded-full">Role: Student (Aarav Sharma)</div>
  </header>
  <main class="max-w-4xl mx-auto p-6 space-y-6">
    <div class="grid grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <div class="text-xs text-slate-400">Attendance</div>
        <div class="text-3xl font-extrabold text-emerald-400 mt-1">94.5%</div>
        <div class="text-xs text-slate-500 mt-1">Present: 170 / 180 Days</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <div class="text-xs text-slate-400">Current Grade</div>
        <div class="text-3xl font-extrabold text-indigo-400 mt-1">A+</div>
        <div class="text-xs text-slate-500 mt-1">Class Rank: 3rd</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <div class="text-xs text-slate-400">Upcoming Test</div>
        <div class="text-xl font-bold text-amber-400 mt-1">Mathematics</div>
        <div class="text-xs text-slate-500 mt-1">Tomorrow @ 9:00 AM</div>
      </div>
    </div>

    <!-- Integrated XYZ AI Assistant Link -->
    <div class="bg-gradient-to-r from-indigo-900/40 to-purple-900/40 border border-indigo-500/30 p-6 rounded-2xl flex items-center justify-between">
      <div>
        <h3 class="font-bold text-lg flex items-center gap-2"><i data-lucide="bot" class="text-indigo-400"></i> XYZ Academic AI Assistant</h3>
        <p class="text-xs text-slate-300 mt-1">Ask questions about your attendance, exam schedule, or study resources.</p>
      </div>
      <a href="../../05. XYZ AI Repository/xyz-ai/index.html?role=student" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition">Launch XYZ AI</a>
    </div>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
